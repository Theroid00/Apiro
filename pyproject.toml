[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apiro"
version = "0.1.0"
description = "A biomedical belief-graph engine using an entropy-guided LLM traversal heuristic."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "chromadb>=0.5.0",
    "requests>=2.31.0",
    "requests-cache>=1.2.0",
    "numpy>=1.26.0",
    "sentence-transformers>=2.7.0",
    "datasets>=2.18.0",
    "nltk>=3.8.1",
    "certifi>=2024.2.2",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
# Enables the primary (context-window-aware) negation classification path in
# apiro/axioms/negation.py. Without it, negation falls back to a regex
# classifier automatically — this is genuinely optional, not a silent gap.
medspacy = [
    "medspacy",
]

[project.scripts]
apiro = "apiro.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apiro*"]

[tool.pytest.ini_options]
# The suite is deliberately offline: every test runs on stubs, with no Ollama,
# no ChromaDB and no model download. `testpaths` keeps a bare `pytest` from
# trying to collect scripts/, which would import the eval harnesses and pull in
# torch/transformers at collection time.
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
